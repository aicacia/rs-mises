[package]
name = "mises-tauri"
version = "0.1.0"
description = "MISES: Mesh Identity and Security Enforcement System Tauri Application"
authors = ["nathanfaucett@gmail.com"]
edition = "2024"

[lib]
name = "mises_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri
tauri = { version = "2", default-features = false, features = [
  "common-controls-v6",
  "compression",
  "dynamic-acl",
  "wry",
  "x11",
] }

# async
tokio = { version = "1", default-features = false, features = [
  "rt",
  "net",
  "io-util",
  "fs",
  "process",
  "time",
] }
tokio-util = { version = "0", default-features = false, features = [] }
tonic = { version = "0.14", default-features = false, features = ["transport"] }

# networking
tower = { version = "0.5", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }

# utils
log = { version = "*" }
uuid = { version = "1", default-features = false, features = ["v7", "std"] }
prost = { version = "0.14", default-features = false }
config = { version = "0.15", default-features = false, features = ["json"] }

# serialization
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = [] }
tauri-plugin-log = { version = "2", default-features = false, features = [] }
tauri-plugin-deep-link = { version = "2", default-features = false, features = [
] }
tauri-plugin-cli = { version = "2", default-features = false, features = [] }
native-authentication = { path = "../../../crates/native-authentication", default-features = false }

# workspace
mises-proto = { path = "../../../crates/proto", default-features = false }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
