[workspace]
members = [
  "crates/async-kv-bytes",
  "crates/core",
  "crates/key",
  "crates/graph",
  "crates/unix-server",
  "crates/proto",
  "crates/grpc-server",
  "crates/native-authentication",
  "apps/mises/src-tauri",
]
resolver = "2"

[workspace.package]
authors = ["nathanfaucett@gmail.com"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aicacia/rs-mises"
rust-version = "1.93"

[workspace.dependencies]
# Serialization
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }

# Utils
chrono = { version = "0.4", default-features = false }
uuid = { version = "1.20", default-features = false }
log = { version = "0.4", default-features = false }
base64 = { version = "0.21", default-features = false }
getrandom = { version = "0.2", default-features = false }

# Async
async-trait = { version = "0.1", default-features = false }
tokio = { version = "1", default-features = false }

# gRPC
tonic = { version = "0.14", default-features = false }
prost = { version = "0.14", default-features = false }
prost-types = { version = "0.14", default-features = false }
tonic-prost = { version = "0.14", default-features = false }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.clippy]
# Security and correctness
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
panic = "warn"

# Performance
clone_on_copy = "warn"
inefficient_to_string = "warn"
large_stack_arrays = "warn"

# Style
missing_docs = "warn"
dbg_macro = "warn"
print_stdout = "warn"
