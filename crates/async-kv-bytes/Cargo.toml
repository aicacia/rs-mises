[package]
name = "mises-async-kv-bytes"
edition = "2024"
version = "0.1.0"
authors = ["nathanfaucett@gmail.com"]
description = "Mises Key-Value Store"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aicacia/rs-mises"
rust-version = "1.93"

[lib]
name = "mises_async_kv_bytes"

[dependencies]
# Async
async-trait = { version = "0.1", default-features = false, features = [] }

# Locking
parking_lot = { version = "0.12", optional = true, default-features = false, features = [
] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }

[features]
default = ["in-memory"]
std = []
in-memory = ["dep:parking_lot"]
