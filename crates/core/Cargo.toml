[package]
name = "mises-core"
edition = "2024"
version = "0.1.0"
authors = ["nathanfaucett@gmail.com"]
description = "Mises Core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aicacia/rs-mises"
rust-version = "1.93"

[lib]
name = "mises_core"

[dependencies]
mises-key = { path = "../key", default-features = false, features = [] }
mises-graph = { path = "../graph", default-features = false }

# Utils
log = { workspace = true, features = [] }
chrono = { workspace = true, features = ["alloc", "serde", "clock"] }
uuid = { workspace = true, features = ["v4", "serde"] }

# Serialization
serde = { workspace = true, features = ["derive", "alloc"] }
serde_json = { workspace = true, features = ["alloc"] }
base64 = { workspace = true, features = ["alloc"] }
getrandom = { workspace = true, features = [] }

# Cryptography
argon2 = { version = "3.0.0", package = "rust-argon2" }

# Async
async-trait = { workspace = true, features = [] }

[dev-dependencies]
# Use the in-memory repository for core unit tests
mises-graph = { path = "../graph", default-features = false, features = [
  "in-memory",
  "std",
] }

mises-key = { path = "../key", default-features = false, features = ["std"] }

tokio = { workspace = true, features = ["macros", "rt"] }
chrono = { workspace = true, features = ["serde", "std"] }

[features]
# default to no_std; enable std opt-in
default = []
std = ["mises-graph/std"]
# enable in-memory graph repository for tests and dev
in-memory = ["mises-graph/in-memory"]
