[package]
name = "mises-grpc-server"
edition = "2024"
version = "0.1.0"
authors = ["nathanfaucett@gmail.com"]
description = "Mises gRPC Server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aicacia/rs-mises"
rust-version = "1.93"

[lib]
name = "mises_grpc_server"

[dependencies]
mises-core = { path = "../core", default-features = false, features = [] }
mises-graph = { path = "../graph", default-features = false, features = [] }
mises-proto = { path = "../proto", default-features = false, features = [] }
mises-async-kv-bytes = { path = "../async-kv-bytes", default-features = false, features = [
] }

# Crypto
jsonwebtoken = { version = "10.3.0", default-features = false, features = [
  "rust_crypto",
] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }

# Serialization
base64 = { version = "0.21", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# Utils
log = { version = "0.4", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = { version = "0.2", default-features = false, features = ["std"] }
url = { version = "2.5", default-features = false, features = ["std"] }
uuid = { version = "1.20", default-features = false, features = [] }

# gRPC
prost-types = { version = "0.14", default-features = false, features = [] }
tonic = { version = "0.14", default-features = false, features = [] }


[dev-dependencies]
mises-graph = { path = "../graph", default-features = false, features = [
  "in-memory",
  "std",
] }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }

[features]
default = ["file-descriptor-set"]
file-descriptor-set = ["mises-proto/file-descriptor-set"]
