syntax = "proto3";
package mises;

service BootstrapService {
    rpc Bootstrap (BootstrapRequest) returns (BootstrapResponse);
}

message BootstrapRequest {
   string root_group_name = 1;
    string owner_name = 2;
    string device_name = 3;
}

message BootstrapResponse {
    string root_group = 1;
    bool master_key_created = 2;
    string master_key_public_key = 3;
    string owner_user = 4;
    string device = 5;
}