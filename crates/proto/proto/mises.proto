syntax = "proto3";
package mises;

service BootstrapService {
    rpc Bootstrap (BootstrapRequest) returns (BootstrapResponse);
}


message BootstrapRequest {
   string root_group_name = 1;
    string owner_name = 2;
    string device_name = 3;
}

message BootstrapResponse {
    string root_group = 1;
    bool master_key_created = 2;
    string master_key_public_key = 3;
    string owner_user = 4;
    string device = 5;

}

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// ---- OIDC service and messages ----
service OidcService {
    // Authorization (browser-style) - returns a redirect URI if applicable
    rpc Authorize (AuthorizeRequest) returns (AuthorizeResponse);

    // Token endpoint supporting multiple grant types
    rpc Token (TokenRequest) returns (TokenResponse);

    // Device Authorization endpoint
    rpc DeviceAuthorize (DeviceAuthorizeRequest) returns (DeviceAuthorizeResponse);

    // Introspection
    rpc Introspect (IntrospectRequest) returns (IntrospectResponse);

    // Revocation (returns empty on success)
    rpc Revoke (RevokeRequest) returns (google.protobuf.Empty);

    // Pushed Authorization Request
    rpc PushedAuthorize (PushedAuthorizeRequest) returns (PushedAuthorizeResponse);

    // Backchannel (CIBA)
    rpc BackchannelAuth (BackchannelAuthRequest) returns (BackchannelAuthResponse);

    // Dynamic client registration
    rpc ClientRegister (ClientRegisterRequest) returns (Client);

    // RP-initiated logout
    rpc EndSession (EndSessionRequest) returns (EndSessionResponse);

    // UserInfo
    rpc GetUserInfo (UserInfoRequest) returns (UserInfo);

    // Provider metadata and keys
    rpc GetOpenIdConfiguration (google.protobuf.Empty) returns (OpenIdConfiguration);
    rpc GetJwks (google.protobuf.Empty) returns (Jwks);
}

message AuthorizeRequest {
    string client_id = 1;
    string response_type = 2;
    optional string response_mode = 3;
    optional string scope = 4;
    optional string redirect_uri = 5;
    optional string state = 6;
    optional string nonce = 7;
    optional google.protobuf.Struct registration = 8; // JSON object
    optional string code_challenge = 9;
    optional string code_challenge_method = 10;
}

message AuthorizeResponse {
    optional string redirect_uri = 1;
}

message TokenRequest {
    oneof grant {
        AuthorizationCode authorization_code = 1;
        RefreshToken refresh_token = 2;
        ClientCredentials client_credentials = 3;
        DeviceCode device_code = 4;
        Password password = 5;
    }
}

message AuthorizationCode {
    string code = 1;
    optional string redirect_uri = 2;
    optional string client_id = 3;
    optional string code_verifier = 4;
}

message RefreshToken {
    string refresh_token = 1;
    optional string scope = 2;
    optional string client_id = 3;
}

message ClientCredentials {
    optional string scope = 1;
    optional string client_id = 2;
}

message DeviceCode {
    string device_code = 1;
    optional string client_id = 2;
}

message Password {
    string username = 1;
    string password = 2;
    optional string scope = 3;
    optional string client_id = 4;
}

message TokenResponse {
    string access_token = 1;
    string token_type = 2;
    optional uint64 expires_in = 3;
    optional string refresh_token = 4;
    optional string id_token = 5;
    optional string scope = 6;
}

message DeviceAuthorizeRequest {
    optional string client_id = 1;
    optional string scope = 2;
}

message DeviceAuthorizeResponse {
    string device_code = 1;
    string user_code = 2;
    string verification_uri = 3;
    optional string verification_uri_complete = 4;
    uint64 expires_in = 5;
    optional uint64 interval = 6;
}

message IntrospectRequest {
    string token = 1;
    optional string token_type_hint = 2;
    optional string client_id = 3;
    optional string client_secret = 4;
}

message IntrospectResponse {
    bool active = 1;
    optional string scope = 2;
    optional string client_id = 3;
    optional string username = 4;
    optional string token_type = 5;
    optional uint64 exp = 6;
    optional uint64 iat = 7;
    optional uint64 nbf = 8;
    optional string sub = 9;
    optional string aud = 10;
    optional string iss = 11;
    optional string jti = 12;
    // When an access token delegates authority to another identity this
    // claim contains the delegated identity id (e.g., a graph Identity ID)
    optional string acting_for = 13;
}

message RevokeRequest {
    string token = 1;
    optional string token_type_hint = 2;
    optional string client_id = 3;
    optional string client_secret = 4;
}

message PushedAuthorizeRequest {
    string client_id = 1;
    optional string response_type = 2;
    optional string response_mode = 3;
    optional string scope = 4;
    optional string redirect_uri = 5;
    optional string state = 6;
    optional string nonce = 7;
    optional google.protobuf.Struct registration = 8;
    optional string code_challenge = 9;
    optional string code_challenge_method = 10;
}

message PushedAuthorizeResponse {
    string request_uri = 1;
    optional uint64 expires_in = 2;
}

message BackchannelAuthRequest {
    optional string client_id = 1;
    optional string scope = 2;
    optional string login_hint = 3;
}

message BackchannelAuthResponse {
    string auth_req_id = 1;
    optional uint64 expires_in = 2;
    optional uint64 interval = 3;
}

message ClientRegisterRequest {
    optional string client_id = 1;
    optional string client_secret = 2;
    optional string name = 3;
    repeated string redirect_uris = 4;
    repeated string grant_types = 5;
    repeated string response_types = 6;
    optional string scope = 7;
    optional string token_endpoint_auth_method = 8;
}

message NativeAuthenticateRequest {
    // client id (UUID string) or development shortcut 'tauri'
    optional string client_id = 1;
    // optional hint about the subject to act as (server may ignore and create its own)
    optional string sub = 2;
    optional string scope = 3;
}

message Client {
    string id = 1; // UUID string
    string client_id = 2;
    optional string client_secret = 3;
    optional string name = 4;
    repeated string redirect_uris = 5;
    repeated string grant_types = 6;
    repeated string response_types = 7;
    optional string scope = 8;
    optional string token_endpoint_auth_method = 9;
}

message EndSessionRequest {
    optional string id_token_hint = 1;
    optional string post_logout_redirect_uri = 2;
    optional string state = 3;
}

message EndSessionResponse {
    optional string redirect_uri = 1;
}

message UserInfoRequest {
    // access token is typically provided in Authorization header; allow explicit token here
    optional string access_token = 1;
}

message UserInfo {
    string sub = 1;
    optional string name = 2;
    optional string given_name = 3;
    optional string family_name = 4;
    optional string preferred_username = 5;
    optional string email = 6;
    optional bool email_verified = 7;
    optional string picture = 8;
}

message OpenIdConfiguration {
    // Core issuer & endpoints
    string issuer = 1;
    optional string authorization_endpoint = 2;
    optional string token_endpoint = 3;
    optional string userinfo_endpoint = 4;
    optional string revocation_endpoint = 5;
    optional string introspection_endpoint = 6;
    optional string jwks_uri = 7;
    optional string registration_endpoint = 8;

    // Supported values
    repeated string scopes_supported = 9;
    repeated string response_types_supported = 10;
    repeated string response_modes_supported = 11;
    repeated string grant_types_supported = 12;
    repeated string token_endpoint_auth_methods_supported = 13;
    repeated string token_endpoint_auth_signing_alg_values_supported = 14;
    repeated string code_challenge_methods_supported = 15;

    // Subject & ID token algorithms
    repeated string subject_types_supported = 16;
    repeated string id_token_signing_alg_values_supported = 17;
    repeated string id_token_encryption_alg_values_supported = 18;
    repeated string id_token_encryption_enc_values_supported = 19;

    // UserInfo & Request object algs
    repeated string userinfo_signing_alg_values_supported = 20;
    repeated string userinfo_encryption_alg_values_supported = 21;
    repeated string request_object_signing_alg_values_supported = 22;
    repeated string request_object_encryption_alg_values_supported = 23;

    // RFC/OIDC metadata
    optional string service_documentation = 24;
    repeated string claims_supported = 25;
    repeated string claims_locales_supported = 26;
    repeated string ui_locales_supported = 27;
    repeated string acr_values_supported = 28;

    // Feature / boolean flags
    optional bool claims_parameter_supported = 29;
    optional bool request_parameter_supported = 30;
    optional bool request_uri_parameter_supported = 31;
    optional bool require_request_uri_registration = 32;

    // Policy & legal
    optional string op_policy_uri = 33;
    optional string op_tos_uri = 34;

    // Session & logout
    optional string check_session_iframe = 35;
    optional string end_session_endpoint = 36;
    optional bool frontchannel_logout_supported = 37;
    optional bool frontchannel_logout_session_supported = 38;
    optional bool backchannel_logout_supported = 39;
    optional bool backchannel_logout_session_supported = 40;

    // Extensions
    optional string device_authorization_endpoint = 41;
    optional string pushed_authorization_request_endpoint = 42;
}

message Jwk {
    string kid = 1;
    string kty = 2;
    string use = 3;
    string alg = 4;
    string crv = 5;
    string x = 6;
    string y = 7;

    // Allowed key operations (e.g., "sign", "verify")
    repeated string key_ops = 8;
} 

message Jwks {
    repeated Jwk keys = 1;
}