[package]
name = "mises-proto"
edition = "2024"
version = "0.1.0"
authors = ["nathanfaucett@gmail.com"]
description = "Mises Protobuf"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aicacia/rs-mises"
rust-version = "1.93"

[lib]
name = "mises_proto"

[dependencies]
# gRPC
prost = { workspace = true, features = [] }
prost-types = { workspace = true, features = [] }
tonic = { workspace = true, features = ["codegen"] }
tonic-prost = { workspace = true, features = [] }

[build-dependencies]
tonic-prost-build = { version = "0.14", default-features = false }

[dev-dependencies]

[package.metadata.cargo-machete]
# Ignore generated code crates
ignored = ["prost", "tonic-prost"]

[features]
default = ["file-descriptor-set"]
file-descriptor-set = []
