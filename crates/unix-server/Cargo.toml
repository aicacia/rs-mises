[package]
name = "mises-unix-server"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Mises Unix Server"
default-run = "mises-unix-server"

[[bin]]
name = "mises-unix-server"

[lib]
name = "mises_unix_server"

[dependencies]
# Internal
mises-core = { path = "../core", default-features = false, features = ["std"] }
mises-graph = { path = "../graph", default-features = false, features = [
  "std",
  "uuid",
  "in-memory",
] }
mises-grpc-server = { path = "../grpc-server", default-features = false, features = [
  "file-descriptor-set",
] }

# Async
tokio = { workspace = true, features = [
  "macros",
  "rt",
  "net",
  "rt-multi-thread",
  "fs",
  "signal",
] }
tokio-stream = { version = "0.1", features = [], default-features = false }
tokio-util = { version = "0.7", features = [], default-features = false }

# CLI
clap = { version = "4.5", features = [
  "std",
  "derive",
  "help",
], default-features = false }
clap_complete = { version = "4.5", default-features = false, features = [] }

# gRPC
tonic = { workspace = true, features = ["server", "router"] }
tonic-reflection = { version = "0.14", default-features = false, features = [
  "server",
] }

# Logging
log = { version = "0.4", default-features = false }
tracing = { version = "0.1", features = ["std"], default-features = false }
tracing-log = { version = "0.2", default-features = false }
tracing-subscriber = { version = "0.3", features = [
  "ansi",
  "fmt",
  "std",
  "tracing-log",
  "env-filter",
], default-features = false }

# Serialization
serde = { workspace = true, features = ["derive"] }

# Utils
url = { version = "2.5", default-features = false, features = ["std"] }
chrono = { workspace = true, features = ["std"] }
config = { version = "0.15", features = ["json"], default-features = false }
machine-uid = { version = "0.5.4", default-features = false, features = [] }

[dev-dependencies]
