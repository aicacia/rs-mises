[package]
name = "native-authentication"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors = ["mises-team"]
description = "Lightweight native authentication helper (Linux only; polkit)"

[lib]
name = "native_authentication"

[dependencies]
# Async
tokio = { version = "1", default-features = false, features = [
  "process",
  "macros",
  "rt",
] }

# Utils
which = { version = "4", default-features = false }

# Error handling (optional)
thiserror = { version = "2.0", default-features = false, optional = true }

[features]
# opt-in feature to enable thiserror derives
default = []
thiserror = ["dep:thiserror"]
