[package]
name = "mises-oidc"
edition = "2024"
version = "0.1.0"
authors = ["nathanfaucett@gmail.com"]
description = "Mises OIDC - OpenID Connect"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aicacia/rs-mises"
rust-version = "1.93"

[lib]
name = "mises_oidc"

[dependencies]
# async
async-trait = { version = "0.1", default-features = false, features = [] }

# cryptography
# base64 for JWT encoding/decoding
base64 = { version = "0.21", default-features = false, features = ["alloc"] }
# key operations for ES256K signing
mises-key = { path = "../key", default-features = false, features = ["std"] }
# k256 for ES256K signing/verification
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

# serialization
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# utils
uuid = { version = "1.0", features = ["serde"], default-features = false }
jsonwebtoken = { version = "10", default-features = false, features = [] }

# workspace
mises-core = { path = "../core", default-features = false }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["full"] }
chrono = { version = "0.4", default-features = false, features = [] }
mises-graph = { path = "../graph", default-features = false, features = [
  "std",
] }

[features]
default = []
std = []
