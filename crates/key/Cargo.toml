[package]
name = "mises-key"
edition = "2024"
version = "0.1.0"
authors = ["nathanfaucett@gmail.com"]
description = "Mises Keys"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aicacia/rs-mises"
rust-version = "1.93"

[lib]
name = "mises_key"

[dependencies]
# utils
zeroize = { version = "1.8", default-features = false, features = [] }
# encodings
bip32 = { version = "0.5", default-features = false, features = [
  "secp256k1",
  "alloc",
] }
bip39 = { version = "2.2", default-features = false, features = [] }
crc32fast = { version = "1.5", default-features = false, features = [] }

# ed25519 + SLIP-0010
slip10 = { version = "0.4", default-features = false, features = [] }
ed25519-dalek = { version = "2.2", default-features = false, features = [
  "alloc",
] }

# optional
getrandom = { version = "0.2", default-features = false, optional = true, features = [
] }


[dev-dependencies]
jsonwebtoken = { version = "9", default-features = false }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
] }
serde_json = { version = "1", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
tempfile = "3"

[features]
default = []
std = ["dep:getrandom"]
